stages:
  - test

variables:
  POSTGRES_DB: test_identity_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  POSTGRES_HOST_AUTH_METHOD: trust

test_identity_service:
  stage: test
  image: python:3.11
  services:
    - postgres:16-alpine
  variables:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: test_user
    DB_PASSWORD: test_password
    DB_NAME: test_identity_db
  script:
    - cd services/identity-service
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pytest tests/ -v --cov=app --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: services/identity-service/report.xml
      coverage_report:
        coverage_format: cobertura
        path: services/identity-service/coverage.xml
    paths:
      - services/identity-service/coverage.xml
      - services/identity-service/report.xml