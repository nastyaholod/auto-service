# Определяем этапы пайплайна
stages:
  - test
  - build

# Глобальные переменные для всех джоб
variables:
  POSTGRES_DB: test_identity_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  POSTGRES_HOST_AUTH_METHOD: trust
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: test_user
  DB_PASSWORD: test_password
  DB_NAME: test_identity_db

# ---------------------------------------------------------
# 1. Тестирование identity-service
# ---------------------------------------------------------
test_identity_service:
  stage: test
  image: python:3.11
  services:
    - name: postgres:16-alpine
      alias: postgres
  
  # Переменные окружения конкретно для этой джобы (переопределяют глобальные для приложения)
  variables:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: test_user
    DB_PASSWORD: test_password
    DB_NAME: test_identity_db

  script:
    # Переходим в папку сервиса
    - cd services/identity-service
    # Устанавливаем зависимости (включая pytest и pytest-cov)
    - pip install --upgrade pip
    - pip install -r requirements.txt
    # Запускаем тесты с генерацией отчетов
    - pytest tests/ -v --cov=app --cov-report=term --cov-report=xml --junitxml=report.xml

  # Извлекаем процент покрытия кода для отображения в GitLab
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+\%)/'

  # Сохраняем артефакты (отчеты), чтобы их можно было скачать или посмотреть в UI
  artifacts:
    when: always
    reports:
      junit: services/identity-service/report.xml
      coverage_report:
        coverage_format: cobertura
        path: services/identity-service/coverage.xml
    paths:
      - services/identity-service/coverage.xml
      - services/identity-service/report.xml

