# 3. Сборка образов 
# ---------------------------------------------------------
build_images:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "Сборка Docker образов..."
    - docker compose build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Запускаем только при пуше в main/master